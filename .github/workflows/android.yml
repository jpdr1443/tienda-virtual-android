# Compila el aplicativo en los servidores de GitHub en cada push y publica
# el APK de depuración como artefacto descargable (pestaña Actions).
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            # Publica los errores como anotaciones para verlos sin abrir el log completo.
            grep -E "^e: |error:|ERROR:|What went wrong|AAPT|FAILURE|Could not|not found" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TiendaVirtual-apk
          path: app/build/outputs/apk/debug/app-debug.apk
